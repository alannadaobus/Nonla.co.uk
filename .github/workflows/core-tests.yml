name: Core tests

# Builds and tests the engine-free DanhCu.Core assembly without Unity.
on:
  push:
    paths:
      - "DanhCuVietnam/Assets/_Project/Scripts/Core/**"
      - "DanhCuVietnam/Assets/_Project/Tests/EditMode/Core/**"
      - "Tools/CoreTests/**"
      - "Tools/TopModelExport/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "DanhCuVietnam/Assets/_Project/Scripts/Core/**"
      - "DanhCuVietnam/Assets/_Project/Tests/EditMode/Core/**"
      - "Tools/CoreTests/**"
      - "Tools/TopModelExport/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test
        run: dotnet test Tools/CoreTests/Tests/DanhCu.Core.Tests.csproj --nologo
      - name: Export top geometry
        run: dotnet run --project Tools/TopModelExport -- top_model_export
